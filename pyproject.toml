[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pluraltree"
version = "0.1.0"
description = "Recursive gating in hyperbolic geometry for hierarchical knowledge graphs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "geoopt>=0.5.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
train = [
    "hydra-core>=1.3",
    "wandb>=0.15",
    "sentence-transformers>=2.2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["pluraltree*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
